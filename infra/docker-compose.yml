services:

  # ==============================
  # Keycloak
  # ==============================
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: bulk-disbursement-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data


  # ==============================
  # Redis
  # ==============================
  redis:
    image: redis:7
    container_name: bulk-disbursement-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  # ==============================
  # Kafka
  # ==============================
  kafka:
    image: apache/kafka:4.1.0
    container_name: bulk-disbursement-kafka
    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data


  # ==============================
  # Kafka UI
  # ==============================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bulk-disbursement-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: bulk-disbursement
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


  # ==============================
  # Prometheus
  # ==============================
  prometheus:
    image: prom/prometheus:latest
    container_name: disbursement-prometheus
    restart: unless-stopped

    ports:
      - "9091:9090"

    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro


  # ==============================
  # Grafana
  # ==============================
  grafana:
    image: grafana/grafana:latest
    container_name: disbursement-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana


# ==============================
# Persistent Volumes
# ==============================
volumes:
  keycloak_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data: